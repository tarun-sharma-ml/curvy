[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "curve-guesser"
version = "0.3.0"
description = "Draw anything on an interactive board and get restricted-domain piecewise equations (lines, parabolas, circular arcs) -- plus whole-shape guesses (circle, ellipse, parabola, line, hyperbola) -- to recreate it in Desmos."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Tarun" }]
keywords = ["piecewise-functions", "desmos", "matplotlib", "drawing", "math", "curve-fitting", "conic-sections"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
curve-guesser = "curve_guesser.cli:main"

[tool.setuptools.packages.find]
include = ["curve_guesser*"]
